x-vpn: &vpn
  image: cisco-socks-proxy:local
  build:
    context: docker/image/vpn-socks
  env_file:
    - ./env/cisco/.env
  volumes:
    - vpn-control:/control
  restart: unless-stopped

services:
  vpn-socks:
    <<: *vpn
    entrypoint: ["python3", "/app/worker.py"]
    environment:
      VPN_SLOT: a
    privileged: true
    stop_grace_period: 20s

  vpn-socks-b:
    <<: *vpn
    entrypoint: ["python3", "/app/worker.py"]
    environment:
      VPN_SLOT: b
    privileged: true
    stop_grace_period: 20s

  vpn-selector:
    <<: *vpn
    entrypoint: ["python3", "/app/controller.py"]
    depends_on:
      - vpn-socks
      - vpn-socks-b

  vpn-gateway:
    <<: *vpn
    entrypoint: ["python3", "/app/gateway.py"]
    volumes:
      - vpn-control:/control:ro
    ports:
      - "127.0.0.1:${CISCO_SOCKS_PORT:-1080}:1080"
    depends_on:
      - vpn-selector

volumes:
  vpn-control:
